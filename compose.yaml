services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build: .
    environment:
      HOOKRELAY_ENVIRONMENT: ${HOOKRELAY_ENVIRONMENT:-development}
      HOOKRELAY_DATABASE_URL: ${HOOKRELAY_DATABASE_URL:-postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay}
      HOOKRELAY_DATABASE_ECHO: ${HOOKRELAY_DATABASE_ECHO:-false}
      HOOKRELAY_REDIS_URL: ${HOOKRELAY_REDIS_URL:-redis://redis:6379/0}
      HOOKRELAY_DEVELOPMENT_API_KEY: ${HOOKRELAY_DEVELOPMENT_API_KEY:-hr_dev_local_change_me}
      HOOKRELAY_SIGNING_ENCRYPTION_KEY: ${HOOKRELAY_SIGNING_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      HOOKRELAY_ALLOW_PRIVATE_ENDPOINT_URLS: ${HOOKRELAY_ALLOW_PRIVATE_ENDPOINT_URLS:-true}
      HOOKRELAY_MAX_REQUEST_BODY_BYTES: ${HOOKRELAY_MAX_REQUEST_BODY_BYTES:-1048576}
      HOOKRELAY_RATE_LIMIT_REQUESTS_PER_MINUTE: ${HOOKRELAY_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: ["python", "-m", "hookrelay.worker"]
    restart: unless-stopped
    environment:
      HOOKRELAY_ENVIRONMENT: ${HOOKRELAY_ENVIRONMENT:-development}
      HOOKRELAY_DATABASE_URL: ${HOOKRELAY_DATABASE_URL:-postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay}
      HOOKRELAY_DATABASE_ECHO: ${HOOKRELAY_DATABASE_ECHO:-false}
      HOOKRELAY_REDIS_URL: ${HOOKRELAY_REDIS_URL:-redis://redis:6379/0}
      HOOKRELAY_SIGNING_ENCRYPTION_KEY: ${HOOKRELAY_SIGNING_ENCRYPTION_KEY:-local-development-encryption-key-change-me}
      HOOKRELAY_ALLOW_PRIVATE_ENDPOINT_URLS: ${HOOKRELAY_ALLOW_PRIVATE_ENDPOINT_URLS:-true}
      HOOKRELAY_DELIVERY_TIMEOUT_SECONDS: ${HOOKRELAY_DELIVERY_TIMEOUT_SECONDS:-5}
      HOOKRELAY_MAX_DELIVERY_ATTEMPTS: ${HOOKRELAY_MAX_DELIVERY_ATTEMPTS:-5}
      HOOKRELAY_RETRY_BASE_DELAY_SECONDS: ${HOOKRELAY_RETRY_BASE_DELAY_SECONDS:-1}
      HOOKRELAY_RETRY_MAX_DELAY_SECONDS: ${HOOKRELAY_RETRY_MAX_DELAY_SECONDS:-60}
      HOOKRELAY_RETRY_SCHEDULE_NAME: ${HOOKRELAY_RETRY_SCHEDULE_NAME:-hookrelay:retries}
      HOOKRELAY_RETRY_SCHEDULER_INTERVAL_MS: ${HOOKRELAY_RETRY_SCHEDULER_INTERVAL_MS:-500}
      HOOKRELAY_RETRY_PROMOTION_BATCH_SIZE: ${HOOKRELAY_RETRY_PROMOTION_BATCH_SIZE:-100}
      HOOKRELAY_WORKER_CLAIM_IDLE_MS: ${HOOKRELAY_WORKER_CLAIM_IDLE_MS:-30000}
      HOOKRELAY_WORKER_CLAIM_INTERVAL_MS: ${HOOKRELAY_WORKER_CLAIM_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-receiver:
        condition: service_healthy

  publisher:
    build: .
    command: ["python", "-m", "hookrelay.publisher"]
    restart: unless-stopped
    environment:
      HOOKRELAY_ENVIRONMENT: ${HOOKRELAY_ENVIRONMENT:-development}
      HOOKRELAY_DATABASE_URL: ${HOOKRELAY_DATABASE_URL:-postgresql+asyncpg://hookrelay:hookrelay@postgres:5432/hookrelay}
      HOOKRELAY_REDIS_URL: ${HOOKRELAY_REDIS_URL:-redis://redis:6379/0}
      HOOKRELAY_OUTBOX_POLL_INTERVAL_MS: ${HOOKRELAY_OUTBOX_POLL_INTERVAL_MS:-500}
      HOOKRELAY_OUTBOX_BATCH_SIZE: ${HOOKRELAY_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-receiver:
    build: .
    command:
      [
        "uvicorn",
        "hookrelay.mock_receiver.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

